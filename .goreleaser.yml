# GoReleaser configuration for dartuios
# Documentation: https://goreleaser.com

version: 2

before:
  hooks:
    # Ensure dependencies are up to date
    - go mod tidy
    # Run tests before building
    # - go test ./...

builds:
  - id: dartuios
    main: ./cmd/dartuios
    binary: dartuios
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
      - arm
      - "386"
    goarm:
      - "6"
      - "7"
    ignore:
      # Windows ARM builds are not commonly needed
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
      # FreeBSD/OpenBSD ARM builds
      - goos: freebsd
        goarch: arm
      - goos: openbsd
        goarch: arm
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser
    flags:
      - -trimpath

  - id: dartuios-web
    main: ./cmd/dartuios-web
    binary: dartuios-web
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
      - arm
      - "386"
    goarm:
      - "6"
      - "7"
    ignore:
      # Windows ARM builds are not commonly needed
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
      # FreeBSD/OpenBSD ARM builds
      - goos: freebsd
        goarch: arm
      - goos: openbsd
        goarch: arm
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser
    flags:
      - -trimpath

  # The ghostty builds link libghostty-vt (static, built by
  # scripts/ghostty-lib.sh at a pinned commit) behind the ghostty build tag.
  # One build per target because cgo needs a per-target compiler; zig is the
  # cross C compiler for all of them. Pure-Go builds above stay the default
  # and keep go install working with no toolchain.
  - id: dartuios-ghostty-linux-amd64
    main: ./cmd/dartuios
    binary: dartuios
    tags:
      - ghostty
    env:
      - CGO_ENABLED=1
      - CC={{ .Env.PWD }}/scripts/zigcc/x86_64-linux-gnu
      - PKG_CONFIG_PATH={{ .Env.PWD }}/.ghostty-vt/x86_64-linux-gnu/pkgconfig
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser
    flags:
      - -trimpath

  - id: dartuios-ghostty-linux-arm64
    main: ./cmd/dartuios
    binary: dartuios
    tags:
      - ghostty
    env:
      - CGO_ENABLED=1
      - CC={{ .Env.PWD }}/scripts/zigcc/aarch64-linux-gnu
      - PKG_CONFIG_PATH={{ .Env.PWD }}/.ghostty-vt/aarch64-linux-gnu/pkgconfig
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser
    flags:
      - -trimpath

  - id: dartuios-ghostty-windows-amd64
    main: ./cmd/dartuios
    binary: dartuios
    tags:
      - ghostty
    env:
      - CGO_ENABLED=1
      - CC={{ .Env.PWD }}/scripts/zigcc/x86_64-windows-gnu
      - PKG_CONFIG_PATH={{ .Env.PWD }}/.ghostty-vt/x86_64-windows-gnu/pkgconfig
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser
    flags:
      - -trimpath

  # The ghostty builds link libghostty-vt (static, built by
  # scripts/ghostty-lib.sh at a pinned commit) behind the ghostty build tag.
  # One build per target because cgo needs a per-target compiler; zig is the
  # cross C compiler for all of them. Pure-Go builds above stay the default
  # and keep go install working with no toolchain.
  - id: dartuios-ghostty-windows-arm64
    main: ./cmd/dartuios
    binary: dartuios
    tags:
      - ghostty
    env:
      - CGO_ENABLED=1
      - CC={{ .Env.PWD }}/scripts/zigcc/aarch64-windows-gnu
      - PKG_CONFIG_PATH={{ .Env.PWD }}/.ghostty-vt/aarch64-windows-gnu/pkgconfig
    goos:
      - windows
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser
    flags:
      - -trimpath

archives:
  - id: dartuios-archive
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    ids:
      - dartuios
    files:
      - README.md
      - LICENSE*

  - id: dartuios-web-archive
    name_template: >-
      {{ .ProjectName }}-web_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    ids:
      - dartuios-web
    files:
      - README.md
      - LICENSE*

  - id: dartuios-ghostty-archive
    name_template: >-
      {{ .ProjectName }}-ghostty_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    ids:
      - dartuios-ghostty-linux-amd64
      - dartuios-ghostty-linux-arm64
      - dartuios-ghostty-windows-amd64
      - dartuios-ghostty-windows-arm64
    files:
      - README.md
      - LICENSE*


checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: "New Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Performance Improvements"
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "Documentation"
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: "Other Changes"
      order: 999

release:
  github:
    owner: darsrc
    name: tuios
  draft: false
  prerelease: auto
  mode: replace
  # The body is docs/release-notes/<tag>.md when that file exists (see
  # .github/workflows/release.yml), and the install instructions live there.
  footer: |
    ---

    **Full Changelog**: https://github.com/darsrc/tuios/compare/{{ .PreviousTag }}...{{ .Tag }}

# AUR (Arch User Repository)
aurs:
  - name: dartuios-bin
    ids:
      - dartuios-archive
    homepage: https://github.com/darsrc/tuios
    description: "Terminal UI Operating System - A terminal-based window manager with tmux-style keybindings"
    maintainers:
      - "Gaurav Gosain <itsgauravgosain@gmail.com>"
    license: MIT
    private_key: "{{ .Env.AUR_SSH_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/dartuios-bin.git"
    provides:
      - dartuios
    conflicts:
      - dartuios
    package: |
      # bin
      install -Dm755 "./dartuios" "${pkgdir}/usr/bin/dartuios"

      # license
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"

      # documentation
      install -Dm644 "./README.md" "${pkgdir}/usr/share/doc/${pkgname}/README.md"

  - name: dartuios-web-bin
    ids:
      - dartuios-web-archive
    homepage: https://github.com/darsrc/tuios
    description: "Web terminal server for dartuios - Serves dartuios through the browser"
    maintainers:
      - "Gaurav Gosain <itsgauravgosain@gmail.com>"
    license: MIT
    private_key: "{{ .Env.AUR_SSH_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/dartuios-web-bin.git"
    provides:
      - dartuios-web
    conflicts:
      - dartuios-web
    package: |
      # bin
      install -Dm755 "./dartuios-web" "${pkgdir}/usr/bin/dartuios-web"

      # license
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"

      # documentation
      install -Dm644 "./README.md" "${pkgdir}/usr/share/doc/${pkgname}/README.md"

# Homebrew tap (using casks for pre-compiled binaries)
homebrew_casks:
  - name: dartuios
    ids:
      - dartuios-archive
    repository:
      owner: darsrc
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/darsrc/tuios
    description: "Terminal UI Operating System - A terminal-based window manager with tmux-style keybindings"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    # The binaries are not signed, so Gatekeeper would refuse to run a
    # quarantined one.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dartuios"]
          end

  - name: dartuios-web
    ids:
      - dartuios-web-archive
    repository:
      owner: darsrc
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/darsrc/tuios
    description: "Web terminal server for dartuios - Serves dartuios through the browser"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }}-web version {{ .Tag }}"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dartuios-web"]
          end

